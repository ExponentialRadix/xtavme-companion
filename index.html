<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unihogar Notes - Inventario</title>
    
    <!-- ETIQUETAS PARA COMPORTARSE COMO APP (PWA) -->
    <meta name="application-name" content="Unihogar">
    <meta name="apple-mobile-web-app-title" content="Unihogar">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#dc2626"> <!-- Rojo corporativo Unihogar -->
    
    <link id="manifest-link" rel="manifest" href="">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23dc2626'%3E%3Crect width='24' height='24' rx='4' fill='%23dc2626'/%3E%3Cpath d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z' fill='white'/%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; user-select: none; }
        input, textarea, select, [contenteditable] { user-select: text; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <script>
        const manifestData = {
            "name": "Unihogar Notes",
            "short_name": "Unihogar",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f8fafc",
            "theme_color": "#dc2626",
            "icons": [{
                "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23dc2626'%3E%3Crect width='24' height='24' rx='4' fill='%23dc2626'/%3E%3Cpath d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z' fill='white'/%3E%3C/svg%3E",
                "sizes": "192x192",
                "type": "image/svg+xml",
                "purpose": "any maskable"
            }]
        };
        const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('manifest-link').href = URL.createObjectURL(blob);
        });
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen overflow-hidden">
    
    <div id="root" class="h-full overflow-y-auto"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const formatCurrency = (value) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(value);
        const formatDate = (dateStr) => new Intl.DateTimeFormat('es-ES', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(dateStr));

        function App() {
            const [products, setProducts] = useState([]);
            const [categories, setCategories] = useState(['Pinturas', 'Papelería', 'Bebidas', 'Lanas', 'Esencias', 'Tutús', 'Malla Mosquitera', 'Letras Madera', 'Ramos Flores']);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('TODAS');
            const [groupByCategory, setGroupByCategory] = useState(false);
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [currentProduct, setCurrentProduct] = useState(null);
            const [viewMode, setViewMode] = useState('grid');
            
            useEffect(() => {
                const savedData = localStorage.getItem('unihogarNotesApp');
                if (savedData) {
                    try { setProducts(JSON.parse(savedData)); } catch (e) { console.error(e); }
                }
                const savedCategories = localStorage.getItem('unihogarCategories');
                if (savedCategories) {
                    try { setCategories(JSON.parse(savedCategories)); } catch (e) { console.error(e); }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('unihogarNotesApp', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('unihogarCategories', JSON.stringify(categories));
            }, [categories]);

            const fileInputRef = useRef(null);

            const handleExport = () => {
                const exportPayload = { products, categories };
                const dataStr = JSON.stringify(exportPayload, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `unihogar_inventario_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (Array.isArray(imported)) {
                            setProducts(imported);
                            const dynamicCats = [...new Set(imported.map(p => p.category).filter(Boolean))];
                            if (dynamicCats.length > 0) setCategories(prev => [...new Set([...prev, ...dynamicCats])]);
                            alert('Datos importados correctamente.');
                        } else if (imported && Array.isArray(imported.products)) {
                            setProducts(imported.products);
                            if (Array.isArray(imported.categories)) setCategories(imported.categories);
                            alert('Datos y categorías importados correctamente.');
                        } else { alert('Formato no válido.'); }
                    } catch (err) { alert('Error al leer archivo.'); }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const addCategoryToCache = (newCat) => {
                if (!newCat || !newCat.trim()) return;
                const trimmed = newCat.trim();
                if (!categories.includes(trimmed)) {
                    setCategories(prev => [...prev, trimmed]);
                }
            };

            const allCategoriesList = ['TODAS', ...categories];

            const filteredProducts = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (p.features && p.features.toLowerCase().includes(searchTerm.toLowerCase())) ||
                    (p.category && p.category.toLowerCase().includes(searchTerm.toLowerCase()));
                
                const productCategory = p.category || 'General';
                const matchesCategory = selectedCategory === 'TODAS' || productCategory === selectedCategory;

                return matchesSearch && matchesCategory;
            });

            const groupedProducts = {};
            if (groupByCategory && selectedCategory === 'TODAS') {
                filteredProducts.forEach(p => {
                    const cat = p.category || 'General';
                    if (!groupedProducts[cat]) groupedProducts[cat] = [];
                    groupedProducts[cat].push(p);
                });
            }

            return (
                <div className="min-h-full flex flex-col justify-between">
                    <div>
                        {/* Cabecera con branding Unihogar */}
                        <header className="bg-red-600 text-white sticky top-0 z-10 shadow-md">
                            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2.5">
                                    <div className="bg-white text-red-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-sm font-black text-lg">
                                        <i className="fas fa-home"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-black tracking-tight leading-none">Unihogar</h1>
                                        <span className="text-[10px] text-red-100 font-medium tracking-wide">TODO LO QUE NECESITAS</span>
                                    </div>
                                </div>
                                
                                <div className="flex-1 max-w-md mx-2">
                                    <div className="relative">
                                        <i className="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="Buscar productos o notas..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="w-full pl-11 pr-4 py-2 bg-white text-slate-800 border-transparent rounded-full focus:ring-2 focus:ring-red-300 transition-all outline-none text-sm placeholder-slate-400 shadow-inner"
                                        />
                                    </div>
                                </div>

                                <div className="flex items-center gap-1 sm:gap-2">
                                    <button 
                                        onClick={() => setViewMode(viewMode === 'grid' ? 'list' : 'grid')} 
                                        className="w-10 h-10 flex items-center justify-center text-white/90 hover:bg-red-700 rounded-full transition-colors" 
                                        title={viewMode === 'grid' ? "Vista de líneas" : "Vista de mosaico"}
                                    >
                                        <i className={`fas ${viewMode === 'grid' ? 'fa-list' : 'fa-th-large'}`}></i>
                                    </button>

                                    <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleImport} />
                                    <button onClick={() => fileInputRef.current.click()} className="w-10 h-10 flex items-center justify-center text-white/90 hover:bg-red-700 rounded-full transition-colors" title="Importar">
                                        <i className="fas fa-upload"></i>
                                    </button>
                                    <button onClick={handleExport} className="w-10 h-10 flex items-center justify-center text-white/90 hover:bg-red-700 rounded-full transition-colors" title="Exportar">
                                        <i className="fas fa-download"></i>
                                    </button>
                                    <button onClick={() => { setCurrentProduct(null); setIsFormOpen(true); }} className="bg-white text-red-600 hover:bg-red-50 w-10 h-10 sm:w-auto sm:px-4 sm:py-2 rounded-full sm:rounded-lg shadow-sm flex items-center justify-center gap-2 font-bold ml-1 transition-transform active:scale-95">
                                        <i className="fas fa-plus"></i>
                                        <span className="hidden sm:inline">Añadir Nota</span>
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* Barra de Categorías y Separador */}
                        <div className="bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shadow-sm">
                            <div className="flex items-center gap-2 overflow-x-auto max-w-full pb-1 sm:pb-0">
                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider mr-1 flex items-center gap-1 flex-shrink-0">
                                    <i className="fas fa-filter"></i> Secciones:
                                </span>
                                {allCategoriesList.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => { setSelectedCategory(cat); if(cat !== 'TODAS') setGroupByCategory(false); }}
                                        className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                                            selectedCategory === cat 
                                                ? 'bg-red-600 text-white shadow-sm shadow-red-200' 
                                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            {selectedCategory === 'TODAS' && (
                                <button
                                    onClick={() => setGroupByCategory(!groupByCategory)}
                                    className={`px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all ${
                                        groupByCategory 
                                            ? 'bg-slate-900 text-white shadow-md' 
                                            : 'bg-red-50 text-red-600 hover:bg-red-100 border border-red-200'
                                    }`}
                                >
                                    <i className="fas fa-layer-group"></i>
                                    {groupByCategory ? 'Ver Todo Juntado' : 'Separar por Categorías'}
                                </button>
                            )}
                        </div>

                        <main className="max-w-7xl w-full mx-auto px-4 py-6 mb-8">
                            {filteredProducts.length === 0 ? (
                                <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 border-dashed m-2 shadow-sm">
                                    <div className="mx-auto w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-4 text-2xl">
                                        <i className="fas fa-clipboard-list"></i>
                                    </div>
                                    <h3 className="text-lg font-semibold text-slate-900 mb-2">No hay notas en esta sección</h3>
                                    <p className="text-slate-500 text-sm max-w-xs mx-auto mb-6">Añade tu primer artículo o importa tu archivo de precios.</p>
                                    <button onClick={() => { setCurrentProduct(null); setIsFormOpen(true); }} className="inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-full transition-colors font-bold shadow-sm">
                                        <i className="fas fa-plus"></i> Crear Primera Nota
                                    </button>
                                </div>
                            ) : groupByCategory ? (
                                <div className="space-y-8">
                                    {Object.keys(groupedProducts).map(catName => (
                                        <div key={catName} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6">
                                            <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                                <h3 className="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
                                                    <span className="w-3 h-3 rounded-full bg-red-600"></span>
                                                    {catName}
                                                </h3>
                                                <span className="text-xs font-semibold px-2.5 py-1 bg-red-50 text-red-600 rounded-full">
                                                    {groupedProducts[catName].length} productos
                                                </span>
                                            </div>

                                            {viewMode === 'grid' ? (
                                                <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                                                    {groupedProducts[catName].map(product => (
                                                        <ProductCard 
                                                            key={product.id} product={product} 
                                                            onEdit={() => { setCurrentProduct(product); setIsFormOpen(true); }}
                                                            onDelete={() => { if(window.confirm('¿Eliminar producto?')) { setProducts(products.filter(p => p.id !== product.id)); } }}
                                                            onHistory={() => { setCurrentProduct(product); setIsHistoryOpen(true); }}
                                                        />
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-left border-collapse">
                                                        <thead>
                                                            <tr className="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                                                <th className="p-3">Producto</th>
                                                                <th className="p-3">Características</th>
                                                                <th className="p-3">Precio</th>
                                                                <th className="p-3 text-right">Acciones</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-100 text-sm">
                                                            {groupedProducts[catName].map(product => (
                                                                <tr key={product.id} className="hover:bg-slate-50/80 transition-colors">
                                                                    <td className="p-3 flex items-center gap-3">
                                                                        {product.image ? <img src={product.image} className="w-8 h-8 rounded-lg object-cover bg-slate-100 flex-shrink-0" /> : <div className="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400 flex-shrink-0"><i className="fas fa-image text-xs"></i></div>}
                                                                        <span className="font-bold text-slate-900">{product.name}</span>
                                                                    </td>
                                                                    <td className="p-3 text-slate-500 truncate max-w-xs">{product.features || "-"}</td>
                                                                    <td className="p-3 font-bold text-red-600">{formatCurrency(product.price)}</td>
                                                                    <td className="p-3 text-right">
                                                                        <div className="flex items-center justify-end gap-1">
                                                                            <button onClick={() => { setCurrentProduct(product); setIsHistoryOpen(true); }} className="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 hover:bg-red-50 hover:text-red-600 flex items-center justify-center"><i className="fas fa-clock-rotate-left text-[10px]"></i></button>
                                                                            <button onClick={() => { setCurrentProduct(product); setIsFormOpen(true); }} className="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center justify-center"><i className="fas fa-pen text-[10px]"></i></button>
                                                                            <button onClick={() => { if(window.confirm('¿Eliminar producto?')) { setProducts(products.filter(p => p.id !== product.id)); } }} className="w-7 h-7 rounded-lg bg-slate-100 text-red-600 hover:bg-red-50 flex items-center justify-center"><i className="fas fa-trash text-[10px]"></i></button>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            ) : viewMode === 'grid' ? (
                                <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
                                    {filteredProducts.map(product => (
                                        <ProductCard 
                                            key={product.id} product={product} 
                                            onEdit={() => { setCurrentProduct(product); setIsFormOpen(true); }}
                                            onDelete={() => { if(window.confirm('¿Eliminar producto?')) { setProducts(products.filter(p => p.id !== product.id)); } }}
                                            onHistory={() => { setCurrentProduct(product); setIsHistoryOpen(true); }}
                                        />
                                    ))}
                                </div>
                            ) : (
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                                    <th className="p-4">Producto</th>
                                                    <th className="p-4">Categoría</th>
                                                    <th className="p-4">Características</th>
                                                    <th className="p-4">Precio</th>
                                                    <th className="p-4">Actualizado</th>
                                                    <th className="p-4 text-right">Acciones</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {filteredProducts.map(product => (
                                                    <tr key={product.id} className="hover:bg-slate-50/80 transition-colors">
                                                        <td className="p-4 flex items-center gap-3">
                                                            {product.image ? (
                                                                <img src={product.image} className="w-10 h-10 rounded-lg object-cover bg-slate-100 flex-shrink-0" />
                                                            ) : (
                                                                <div className="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400 flex-shrink-0">
                                                                    <i className="fas fa-image"></i>
                                                                </div>
                                                            )}
                                                            <span className="font-bold text-slate-900">{product.name}</span>
                                                        </td>
                                                        <td className="p-4">
                                                            <span className="bg-red-50 text-red-700 text-xs font-semibold px-2.5 py-1 rounded-full">
                                                                {product.category || 'General'}
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-slate-500 max-w-xs truncate">{product.features || "Sin características"}</td>
                                                        <td className="p-4 font-bold text-red-600">{formatCurrency(product.price)}</td>
                                                        <td className="p-4 text-xs text-slate-400">{new Date(product.updatedAt).toLocaleDateString('es-ES')}</td>
                                                        <td className="p-4 text-right">
                                                            <div className="flex items-center justify-end gap-1">
                                                                <button onClick={() => { setCurrentProduct(product); setIsHistoryOpen(true); }} className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 transition-colors flex items-center justify-center" title="Historial">
                                                                    <i className="fas fa-clock-rotate-left text-xs"></i>
                                                                </button>
                                                                <button onClick={() => { setCurrentProduct(product); setIsFormOpen(true); }} className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors flex items-center justify-center" title="Editar">
                                                                    <i className="fas fa-pen text-xs"></i>
                                                                </button>
                                                                <button onClick={() => { if(window.confirm('¿Eliminar producto?')) { setProducts(products.filter(p => p.id !== product.id)); } }} className="w-8 h-8 rounded-lg bg-slate-100 hover:bg-red-50 text-red-600 transition-colors flex items-center justify-center" title="Eliminar">
                                                                    <i className="fas fa-trash text-xs"></i>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    <footer className="bg-white border-t border-slate-200 py-6 px-4 mt-auto">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-500">
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-slate-800">Unihogar Notes</span>
                                <span>&bull;</span>
                                <span>Todo lo que necesitas para tu casa</span>
                            </div>
                            <div className="flex flex-wrap items-center justify-center gap-3">
                                <span className="bg-slate-100 px-2.5 py-1 rounded-md font-medium text-slate-600">React 18</span>
                                <span className="bg-slate-100 px-2.5 py-1 rounded-md font-medium text-slate-600">Tailwind CSS</span>
                                <span className="bg-slate-100 px-2.5 py-1 rounded-md font-medium text-slate-600">LocalStorage</span>
                                <span className="bg-red-50 text-red-700 px-2.5 py-1 rounded-md font-semibold">PWA Ready</span>
                            </div>
                            <div className="text-slate-600 font-medium">
                                Creado por <span className="text-red-600 font-bold">Tu Nombre</span> &copy; 2026
                            </div>
                        </div>
                    </footer>

                    {isFormOpen && <ProductFormModal product={currentProduct} categories={categories} onClose={() => setIsFormOpen(false)} onSave={(data) => {
                        addCategoryToCache(data.category);
                        if (currentProduct) {
                            let changes = [], priceChanged = false;
                            if (currentProduct.price !== data.price) { changes.push(`Precio: ${formatCurrency(currentProduct.price)} ➔ ${formatCurrency(data.price)}`); priceChanged = true; }
                            if (currentProduct.name !== data.name) changes.push("Nombre editado");
                            if (currentProduct.category !== data.category) changes.push(`Categoría: ${currentProduct.category || 'General'} ➔ ${data.category}`);
                            if (currentProduct.features !== data.features) changes.push("Características editadas");
                            if (currentProduct.notes !== data.notes) changes.push("Notas editadas");
                            if (currentProduct.image !== data.image) changes.push("Imagen cambiada");

                            const now = new Date().toISOString();
                            setProducts(products.map(p => p.id === currentProduct.id ? {
                                ...currentProduct, ...data, updatedAt: now,
                                priceHistory: priceChanged ? [{ price: data.price, date: now }, ...currentProduct.priceHistory] : currentProduct.priceHistory,
                                editHistory: changes.length > 0 ? [{ date: now, changes: changes.join(", ") }, ...currentProduct.editHistory] : currentProduct.editHistory
                            } : p));
                        } else {
                            const now = new Date().toISOString();
                            setProducts([{
                                ...data, id: Date.now().toString(), createdAt: now, updatedAt: now,
                                priceHistory: [{ price: data.price, date: now }], editHistory: [{ date: now, changes: "Producto creado" }]
                            }, ...products]);
                        }
                        setIsFormOpen(false);
                    }} />}

                    {isHistoryOpen && currentProduct && <HistoryModal product={currentProduct} onClose={() => setIsHistoryOpen(false)} />}
                </div>
            );
        }

        function ProductCard({ product, onEdit, onDelete, onHistory }) {
            return (
                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex flex-col hover:shadow-md transition-shadow">
                    <div className="aspect-square bg-slate-100 relative overflow-hidden flex items-center justify-center group">
                        {product.image ? ( <img src={product.image} alt={product.name} className="w-full h-full object-cover" /> ) : ( <i className="fas fa-image text-slate-300 text-4xl"></i> )}
                        <span className="absolute top-2 left-2 bg-slate-900/75 backdrop-blur-sm text-white text-[10px] font-bold px-2.5 py-0.5 rounded-md">
                            {product.category || 'General'}
                        </span>
                        <div className="absolute top-2 right-2 flex flex-col gap-2">
                            <button onClick={onEdit} className="w-8 h-8 bg-white/95 text-slate-700 rounded-full shadow-md flex items-center justify-center active:scale-95 transition-transform"><i className="fas fa-pen text-xs"></i></button>
                            <button onClick={onDelete} className="w-8 h-8 bg-white/95 text-red-600 rounded-full shadow-md flex items-center justify-center active:scale-95 transition-transform"><i className="fas fa-trash text-xs"></i></button>
                        </div>
                    </div>
                    
                    <div className="p-3 sm:p-4 flex flex-col flex-1">
                        <h3 className="font-bold text-slate-900 text-sm sm:text-base leading-tight line-clamp-1 mb-1">{product.name}</h3>
                        <span className="font-bold text-red-600 text-base sm:text-lg mb-2">{formatCurrency(product.price)}</span>
                        
                        <div className="mt-auto pt-3 border-t border-slate-100 flex justify-between items-center">
                            <button onClick={onHistory} className="text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-red-50 hover:text-red-600 active:bg-slate-200 px-3 py-2 rounded-lg w-full flex justify-center items-center gap-2 transition-colors">
                                <i className="fas fa-clock-rotate-left"></i> Historial
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function ProductFormModal({ product, categories, onClose, onSave }) {
            const [formData, setFormData] = useState({ 
                name: product?.name || '', 
                category: product?.category || (categories[0] || 'General'), 
                features: product?.features || '', 
                notes: product?.notes || '', 
                price: product?.price || '', 
                image: product?.image || '' 
            });
            const [isCameraActive, setIsCameraActive] = useState(false);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.name === 'price' ? parseFloat(e.target.value) || '' : e.target.value }));

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setFormData(prev => ({ ...prev, image: reader.result }));
                    reader.readAsDataURL(file);
                }
            };

            const startCamera = async () => {
                setIsCameraActive(true);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    if (videoRef.current) videoRef.current.srcObject = stream;
                } catch (err) {
                    console.error("Error al acceder a la cámara:", err);
                    alert("No se pudo acceder a la cámara.");
                    setIsCameraActive(false);
                }
            };

            const capturePhoto = () => {
                if (videoRef.current && canvasRef.current) {
                    const video = videoRef.current;
                    const canvas = canvasRef.current;
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg');
                    setFormData(prev => ({ ...prev, image: dataUrl }));
                    stopCamera();
                }
            };

            const stopCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    const stream = videoRef.current.srcObject;
                    stream.getTracks().forEach(track => track.stop());
                    videoRef.current.srcObject = null;
                }
                setIsCameraActive(false);
            };

            useEffect(() => { return () => { stopCamera(); }; }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                stopCamera();
                if (!formData.name || !formData.price) return alert('Nombre y precio obligatorios');
                onSave({ ...formData, price: Number(formData.price) });
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center sm:p-4">
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-xl w-full max-w-2xl flex flex-col max-h-[90vh]">
                        <div className="flex justify-between items-center p-4 sm:p-5 border-b border-slate-100">
                            <h2 className="text-lg sm:text-xl font-bold text-slate-900">{product ? 'Editar Nota' : 'Nueva Nota de Producto'}</h2>
                            <button onClick={() => { stopCamera(); onClose(); }} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 active:bg-slate-200"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="overflow-y-auto p-4 sm:p-6 pb-20 sm:pb-6">
                            <form id="product-form" onSubmit={handleSubmit} className="space-y-4 sm:space-y-5">
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Nombre del Producto</label>
                                        <input type="text" name="name" value={formData.name} onChange={handleChange} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-red-500 focus:bg-white transition-colors" placeholder="Ej. Spray Normal" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Sección / Categoría</label>
                                        <input 
                                            type="text" 
                                            name="category" 
                                            value={formData.category} 
                                            onChange={handleChange} 
                                            list="category-cache-list" 
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-red-500 focus:bg-white transition-colors" 
                                            placeholder="Escribe o selecciona..." 
                                        />
                                        <datalist id="category-cache-list">
                                            {categories.map(cat => <option key={cat} value={cat} />)}
                                        </datalist>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Precio (€)</label>
                                    <input type="number" step="0.01" name="price" value={formData.price} onChange={handleChange} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-red-500 focus:bg-white font-bold text-red-600 text-lg transition-colors" placeholder="0.00" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Foto del Producto</label>
                                    
                                    {isCameraActive ? (
                                        <div className="relative rounded-xl overflow-hidden bg-black h-48 flex flex-col items-center justify-center">
                                            <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                                            <canvas ref={canvasRef} className="hidden"></canvas>
                                            <div className="absolute bottom-3 flex gap-2">
                                                <button type="button" onClick={capturePhoto} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg flex items-center gap-1.5">
                                                    <i className="fas fa-camera"></i> Capturar Foto
                                                </button>
                                                <button type="button" onClick={stopCamera} className="bg-slate-700 text-white px-3 py-2 rounded-full text-xs font-bold">
                                                    Cancelar
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-2">
                                            <div className="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 h-32 relative flex items-center justify-center overflow-hidden">
                                                {formData.image ? <img src={formData.image} className="w-full h-full object-cover" /> : <div className="text-slate-400 flex flex-col items-center"><i className="fas fa-image text-2xl mb-1"></i><span className="text-xs">Sin foto seleccionada</span></div>}
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-colors">
                                                    <i className="fas fa-upload"></i> Subir Archivo
                                                    <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                                                </label>
                                                <button type="button" onClick={startCamera} className="bg-red-50 hover:bg-red-100 text-red-600 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-colors">
                                                    <i className="fas fa-camera"></i> Usar Cámara
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Características / Medidas</label>
                                    <textarea name="features" value={formData.features} onChange={handleChange} rows="2" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-red-500 focus:bg-white resize-none" placeholder="Tallas, colores, detalles..."></textarea>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Notas Internas</label>
                                    <textarea name="notes" value={formData.notes} onChange={handleChange} rows="2" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-red-500 focus:bg-white resize-none" placeholder="Proveedor, stock, recordatorios..."></textarea>
                                </div>
                            </form>
                        </div>
                        <div className="p-4 border-t border-slate-100 bg-white sm:bg-slate-50 flex gap-3 sticky bottom-0">
                            <button type="submit" form="product-form" className="flex-1 py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg shadow-red-200 active:scale-95 transition-colors flex justify-center items-center gap-2">
                                <i className="fas fa-save"></i> Guardar Nota
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function HistoryModal({ product, onClose }) {
            const [activeTab, setActiveTab] = useState('prices');
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center sm:p-4">
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-xl w-full max-w-lg flex flex-col h-[80vh] sm:max-h-[85vh]">
                        <div className="flex justify-between items-center p-4 border-b border-slate-100">
                            <div className="flex items-center gap-3">
                                {product.image ? <img src={product.image} className="w-10 h-10 rounded-lg object-cover" /> : <div className="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center"><i className="fas fa-box text-slate-400"></i></div>}
                                <div>
                                    <h2 className="font-bold text-slate-900 leading-tight">Historial de Cambios</h2>
                                    <p className="text-xs text-slate-500 font-medium truncate w-40">{product.name}</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 text-slate-500 active:bg-slate-200"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="flex border-b border-slate-200">
                            <button onClick={() => setActiveTab('prices')} className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 ${activeTab === 'prices' ? 'text-red-600 border-b-2 border-red-600' : 'text-slate-500'}`}><i className="fas fa-chart-line"></i> Precios</button>
                            <button onClick={() => setActiveTab('edits')} className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 ${activeTab === 'edits' ? 'text-red-600 border-b-2 border-red-600' : 'text-slate-500'}`}><i className="fas fa-history"></i> Ediciones</button>
                        </div>
                        <div className="overflow-y-auto p-5 flex-1 bg-slate-50/50">
                            {activeTab === 'prices' && (
                                <div className="space-y-0 relative before:absolute before:inset-y-0 before:left-[11px] before:w-0.5 before:bg-slate-200">
                                    {product.priceHistory?.map((entry, index) => (
                                        <div key={index} className="relative flex gap-4 pb-6 last:pb-0">
                                            <div className={`w-6 h-6 rounded-full border-4 border-white ${index === 0 ? 'bg-red-600 shadow-md' : 'bg-slate-300'} z-10`}></div>
                                            <div className="-mt-1">
                                                <span className={`block font-bold ${index === 0 ? 'text-red-600 text-xl' : 'text-slate-600 text-lg'}`}>{formatCurrency(entry.price)}</span>
                                                <span className="text-xs font-medium text-slate-400">{formatDate(entry.date)}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                            {activeTab === 'edits' && (
                                <div className="space-y-3">
                                    {product.editHistory?.map((entry, index) => (
                                        <div key={index} className="bg-white rounded-xl p-4 border border-slate-100 shadow-sm">
                                            <div className="text-xs font-bold text-slate-400 mb-1">{formatDate(entry.date)}</div>
                                            <p className="text-sm text-slate-700">{entry.changes}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
